name: Build & Publish FaceFusion Dev APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 Platform & Build Tools 34.0.0
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;34.0.0"

      - name: Extract prebuilt native libraries from upstream v0.9.41 release APK
        run: |
          mkdir -p prebuilt-native/arm64-v8a
          curl -fSL -o upstream.apk "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.41/facefusion-mobile-0.9.41-release.apk"
          mkdir -p apk_tmp
          unzip -q upstream.apk "lib/arm64-v8a/*.so" -d apk_tmp
          mv apk_tmp/lib/arm64-v8a/*.so prebuilt-native/arm64-v8a/
          rm -rf upstream.apk apk_tmp
          ls -lh prebuilt-native/arm64-v8a/

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v -keystore work/android/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ffdev -storepass facefusiondev -keypass facefusiondev -dname "CN=FaceFusionDev, OU=Mobile, O=Dev, L=Chennai, ST=TN, C=IN"
          printf "storeFile=release.jks\nstorePassword=facefusiondev\nkeyAlias=ffdev\nkeyPassword=facefusiondev\n" > work/android/keystore.properties

      - name: Build Signed Release APK
        run: |
          chmod +x work/android/gradlew
          ./work/android/gradlew -p work/android :app:assembleRelease -PprebuiltNativeDir="$GITHUB_WORKSPACE/prebuilt-native" --no-daemon

      - name: Verify APK output
        run: |
          ls -lh work/android/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mobile-dev-apk
          path: work/android/app/build/outputs/apk/release/*.apk

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.41-dev-r${{ github.run_number }}
          name: FaceFusion Dev v0.9.41 (Build ${{ github.run_number }})
          body: |
            - Package ID: `com.facefusion.mobile.dev` (installs side-by-side)
            - App Label: `FaceFusion Dev`
            - ContentGate (NSFW filter): Disabled across Photo, Video, Live Camera, Batch & API
            - Signed Release APK ready to install on Android 12+ (arm64-v8a)
          files: work/android/app/build/outputs/apk/release/*.apk
          make_latest: true
